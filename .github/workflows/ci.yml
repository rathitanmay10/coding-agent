name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Type check (ty)
        continue-on-error: true
        run: uv run ty check src/
      - name: Tests
        run: uv run pytest
